<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" role="img" aria-label="Nuclear diagram of iron-56 Fe3+ ion">
<rect width="420" height="320" fill="#FFFFFF"/>
<text x="210" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">⁵⁶Fe³⁺ — protons, neutrons, electrons</text>
<circle cx="140" cy="160" r="70" fill="#FFE8CC" stroke="#1A1A1A" stroke-width="2"/>
<text x="140" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">nucleus</text>
<text x="140" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#E53935">26 p⁺</text>
<text x="140" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#2B5FD9">30 n⁰</text>
<ellipse cx="300" cy="160" rx="90" ry="70" fill="none" stroke="#2B5FD9" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="300" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">electron cloud</text>
<text x="300" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#2B5FD9">23 e⁻</text>
<text x="300" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">(26 − 3 = 23)</text>
<text x="140" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1A1A1A">Z = 26, A = 56</text>
<text x="140" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1A1A1A">neutrons = A − Z = 30</text>
<text x="300" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1A1A1A">charge = +3</text>
<text x="300" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1A1A1A">e⁻ = Z − charge</text>
<text x="210" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5F6B7A">For Fe-56: 26 protons + 30 neutrons; Fe³⁺ has lost 3 electrons.</text>
</svg>
