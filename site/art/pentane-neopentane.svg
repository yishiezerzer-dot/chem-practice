<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="Pentane chain versus compact neopentane">
<rect width="560" height="300" fill="#FFFFFF"/>
<text x="280" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">Shape and dispersion: pentane vs neopentane</text>
<text x="140" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">n-pentane (straight chain)</text>
<line x1="40" y1="140" x2="80" y2="100" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
<line x1="80" y1="100" x2="120" y2="140" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
<line x1="120" y1="140" x2="160" y2="100" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
<line x1="160" y1="100" x2="200" y2="140" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
<circle cx="40" cy="140" r="5" fill="#1A1A1A"/>
<circle cx="80" cy="100" r="5" fill="#1A1A1A"/>
<circle cx="120" cy="140" r="5" fill="#1A1A1A"/>
<circle cx="160" cy="100" r="5" fill="#1A1A1A"/>
<circle cx="200" cy="140" r="5" fill="#1A1A1A"/>
<text x="120" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">more surface contact</text>
<text x="120" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17754A">→ stronger London forces</text>
<text x="120" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17754A">→ higher boiling point</text>
<text x="420" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">neopentane (branched)</text>
<line x1="420" y1="130" x2="420" y2="70" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
<circle cx="420" cy="70" r="5" fill="#1A1A1A"/>
<line x1="420" y1="130" x2="420" y2="190" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
<circle cx="420" cy="190" r="5" fill="#1A1A1A"/>
<line x1="420" y1="130" x2="360" y2="130" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
<circle cx="360" cy="130" r="5" fill="#1A1A1A"/>
<line x1="420" y1="130" x2="480" y2="130" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
<circle cx="480" cy="130" r="5" fill="#1A1A1A"/>
<circle cx="420" cy="130" r="5" fill="#1A1A1A"/>
<text x="420" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">compact / less surface</text>
<text x="420" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#E53935">→ weaker dispersion</text>
<text x="420" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#E53935">→ lower boiling point</text>
<text x="280" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">Same formula C₅H₁₂; branching lowers bp because of weaker London contacts.</text>
</svg>
