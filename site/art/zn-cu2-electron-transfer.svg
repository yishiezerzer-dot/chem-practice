<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-label="Electron transfer from zinc metal to copper(II) ions">
<rect width="520" height="280" fill="#FFFFFF"/>
<text x="260" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">Electron transfer: Zn + Cu²⁺ → Zn²⁺ + Cu</text>
<rect x="40" y="80" width="100" height="80" rx="8" fill="#B0BEC5" stroke="#1A1A1A" stroke-width="2"/>
<text x="90" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">Zn(s)</text>
<text x="90" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">reducing agent</text>
<text x="90" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#E53935">(oxidized)</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2B5FD9"/></marker></defs>
<line x1="160" y1="110" x2="240" y2="110" stroke="#2B5FD9" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="200" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2B5FD9">2 e⁻</text>
<circle cx="300" cy="120" r="36" fill="#BBDEFB" stroke="#2B5FD9" stroke-width="2"/>
<text x="300" y="115" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#2B5FD9">Cu²⁺</text>
<text x="300" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">(aq)</text>
<text x="300" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">oxidizing agent</text>
<text x="300" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17754A">(reduced)</text>
<text x="260" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">Products: Zn²⁺(aq) + Cu(s)</text>
<text x="260" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">Oxidation: Zn → Zn²⁺ + 2 e⁻    Reduction: Cu²⁺ + 2 e⁻ → Cu</text>
</svg>
