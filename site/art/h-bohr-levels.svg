<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" role="img" aria-label="Bohr energy levels for hydrogen with Balmer n=3 to n=2">
<rect width="420" height="360" fill="#FFFFFF"/>
<text x="210" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">Hydrogen energy levels (Bohr)</text>
<line x1="70" y1="50" x2="70" y2="320" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="40" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">E</text>
<polygon points="70,42 66,52 74,52" fill="#1A1A1A"/>
<line x1="90" y1="290" x2="280" y2="290" stroke="#2B5FD9" stroke-width="2.5"/>
<text x="50" y="295" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">n=1</text>
<text x="295" y="295" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">−13.60 eV</text>
<line x1="90" y1="180" x2="280" y2="180" stroke="#2B5FD9" stroke-width="2.5"/>
<text x="50" y="185" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">n=2</text>
<text x="295" y="185" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">−3.40 eV</text>
<line x1="90" y1="120" x2="280" y2="120" stroke="#2B5FD9" stroke-width="2.5"/>
<text x="50" y="125" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">n=3</text>
<text x="295" y="125" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">−1.51 eV</text>
<line x1="90" y1="60" x2="280" y2="60" stroke="#5F6B7A" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="50" y="65" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">n=∞</text>
<text x="295" y="65" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">0 eV</text>
<line x1="200" y1="120" x2="200" y2="180" stroke="#E53935" stroke-width="2.5"/>
<polygon points="200,180 195,168 205,168" fill="#E53935"/>
<text x="210" y="155" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#E53935">photon</text>
<text x="210" y="172" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#E53935">656 nm (Balmer)</text>
<text x="210" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">Eₙ = −13.6 eV / n²   ·   emission when electron falls to lower n</text>
</svg>
