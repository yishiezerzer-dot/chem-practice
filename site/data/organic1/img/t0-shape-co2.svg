<text x="240.00" y="236.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">O: 3 electron groups, so sp².</text>
<text x="240.00" y="260.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">O is an end atom with one bond,</text>
