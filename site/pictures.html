<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sample pictures: Organic Chemistry 1</title>
<link rel="stylesheet" href="style.css">
<style>
.pic{display:block;max-width:100%;height:auto;margin:0 auto}
figure{margin:0 0 12px}
.f{margin:4px 0}
code{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1 id="h"></h1>
<p class="meta" id="note"></p>
<div id="list"></div>
</main>
<script>
(function () {
  var he = new URLSearchParams(location.search).get('lang') === 'he';
  var T = he
    ? { h: 'תמונות לדוגמה: כימיה אורגנית 1', note: 'התמונות עדיין לא נבדקו על ידי Chem Sketcher.', id: 'מזהה', smiles: 'SMILES', alt: 'תיאור', err: 'לא ניתן לטעון את הקובץ pictures.json' }
    : { h: 'Sample pictures: Organic Chemistry 1', note: 'These pictures are not yet checked by Chem Sketcher.', id: 'ID', smiles: 'SMILES', alt: 'Description', err: 'Could not load pictures.json' };
  var root = document.documentElement;
  root.lang = he ? 'he' : 'en';
  root.dir = he ? 'rtl' : 'ltr';
  document.title = T.h;
  document.getElementById('h').textContent = T.h;
  document.getElementById('note').textContent = T.note;

  function ltr(tag, text) {
    var e = document.createElement(tag);
    if (he) { e.dir = 'ltr'; e.lang = 'en'; }
    e.textContent = text;
    return e;
  }
  function row(label, node) {
    var d = document.createElement('div');
    d.className = 'meta f';
    if (he && /[A-Za-z]/.test(label)) { d.appendChild(ltr('bdi', label)); d.appendChild(document.createTextNode(': ')); }
    else d.appendChild(document.createTextNode(label + ': '));
    d.appendChild(node);
    return d;
  }

  fetch('data/organic1/pictures.json').then(function (r) { return r.json(); }).then(function (j) {
    var list = document.getElementById('list');
    j.pictures.forEach(function (p) {
      var card = document.createElement('div');
      card.className = 'card';
      var fig = document.createElement('figure');
      fig.dir = 'ltr';
      var img = document.createElement('img');
      img.className = 'pic';
      img.src = 'data/organic1/img/' + p.file;
      img.width = p.width;
      img.height = p.height;
      img.alt = p.alt;
      fig.appendChild(img);
      card.appendChild(fig);

      var idEl = he ? ltr('bdi', p.id) : document.createTextNode(p.id);
      var smEl = document.createElement('code');
      smEl.dir = 'ltr';
      smEl.textContent = p.smiles;
      var altEl = he ? ltr('bdi', p.alt) : document.createTextNode(p.alt);
      card.appendChild(row(T.id, idEl));
      card.appendChild(row(T.smiles, smEl));
      var a = row(T.alt, altEl);
      a.className = 'cap f';
      card.appendChild(a);
      list.appendChild(card);
    });
  }).catch(function () {
    document.getElementById('list').textContent = T.err;
  });
})();
</script>
</body>
</html>
