<text x="240.00" y="318.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">The lone pair is not counted</text>
<text x="240.00" y="342.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">in the molecular shape,</text>
<text x="240.00" y="366.00" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">so H₃O⁺ is trigonal pyramidal.</text>
<text x="240.00" y="390.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">Hydrogen is not hybridized.</text>
