<text x="286.00" y="71.70" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1A1A1A">O: sp³, trigonal pyramidal</text>
<text x="286.00" y="93.70" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1A1A1A">(from tetrahedral)</text>
<text x="240.00" y="270.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">4 electron groups give</text>
