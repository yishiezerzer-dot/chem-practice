<text x="296.00" y="214.00" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1A1A1A">C: sp²,</text>
<text x="296.00" y="236.00" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1A1A1A">trigonal planar</text>
<line x1="250.00" y1="86.00" x2="250.00" y2="38.00" stroke="#5F6B7A" stroke-width="1.15" stroke-linecap="round"/>
<text x="250.00" y="8.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1A1A1A">carbonyl O: sp²</text>
<text x="250.00" y="30.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1A1A1A">(no molecular shape)</text>
<line x1="210.00" y1="158.00" x2="170.00" y2="194.00" stroke="#5F6B7A" stroke-width="1.15" stroke-linecap="round"/>
<text x="162.00" y="193.70" text-anchor="end" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1A1A1A">OH oxygen: sp³, bent</text>
<text x="162.00" y="215.70" text-anchor="end" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1A1A1A">(from tetrahedral)</text>
<text x="250.00" y="310.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">Carbonyl O: 3 electron groups, so sp².</text>
<text x="250.00" y="334.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">It is an end atom with one bond,</text>
<text x="250.00" y="358.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">so it has no molecular shape.</text>
<text x="250.00" y="382.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">OH oxygen: 4 electron groups give</text>
<text x="250.00" y="406.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">a tetrahedral parent shape.</text>
<text x="250.00" y="430.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">2 lone pairs are not counted,</text>
<text x="250.00" y="454.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">so it is bent.</text>
<text x="250.00" y="478.00" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#5F6B7A">Hydrogen is not hybridized.</text>
