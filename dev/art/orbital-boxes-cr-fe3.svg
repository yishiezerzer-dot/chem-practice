<polygon points="190.0,196 186.0,202 194.0,202" fill="#1A1A1A"/>
<text x="236.0" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">4s</text>
<rect x="222" y="190" width="28" height="28" fill="#FAFAFA" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="40" y="240" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">4s empty; five unpaired 3d electrons (half-filled)</text>
<text x="280" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">Transition-metal cations: remove s electrons before d electrons.</text>
</svg>
