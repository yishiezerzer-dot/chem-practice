<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="Orbital boxes for Cr exception and Fe3+ ion">
<rect width="560" height="320" fill="#FFFFFF"/>
<text x="280" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">Exceptions and ions — orbital boxes</text>
<text x="40" y="58" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">Cr (Z=24): [Ar] 3d⁵ 4s¹  (not 3d⁴ 4s²)</text>
<text x="122.0" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">3d</text>
