<text x="40" y="128" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">Half-filled 3d + half-filled 4s preferred</text>
<text x="40" y="170" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">Fe³⁺: Fe is [Ar] 3d⁶ 4s² → remove 4s then 3d → [Ar] 3d⁵</text>
<text x="122.0" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">3d</text>
