<polygon points="156.0,84 152.0,90 160.0,90" fill="#1A1A1A"/>
<rect x="176" y="78" width="28" height="28" fill="#FAFAFA" stroke="#1A1A1A" stroke-width="1.5"/>
<line x1="190.0" y1="100" x2="190.0" y2="84" stroke="#1A1A1A" stroke-width="2"/>
<polygon points="190.0,84 186.0,90 194.0,90" fill="#1A1A1A"/>
<text x="236.0" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">4s</text>
