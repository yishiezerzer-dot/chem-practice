<text x="380" y="186" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1A1A1A">Z = 26, A = 56</text>
<text x="380" y="205" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1A1A1A">n⁰ = A − Z = 30</text>
<text x="380" y="316" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1A1A1A">charge = +3</text>
<text x="280.0" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">Not to scale: a real nucleus is ~100 000× smaller than the atom.</text>
