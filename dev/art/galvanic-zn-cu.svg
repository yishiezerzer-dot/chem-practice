<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" width="620" height="450" role="img" aria-label="Zinc copper galvanic cell with salt bridge and electron flow">
<rect width="620" height="450" fill="#FFFFFF"/>
<text x="310" y="18" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">Zn | Zn²⁺ || Cu²⁺ | Cu  galvanic cell</text>
<text x="310" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5F6B7A">E°_cell = 1.10 V   ·   anode = oxidation (Zn)   ·   cathode = reduction (Cu)</text>
<rect x="50" y="160" width="170" height="170" rx="4" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="2"/>
<rect x="400" y="160" width="170" height="170" rx="4" fill="#BBDEFB" stroke="#1A1A1A" stroke-width="2"/>
<text x="135" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5F6B7A">Zn²⁺(aq)</text>
<text x="485" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#2B5FD9">Cu²⁺(aq)</text>
<rect x="115" y="140" width="20" height="150" fill="#90A4AE" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="90" y="152" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Zn</text>
<rect x="475" y="140" width="20" height="150" fill="#FF8A65" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="520" y="152" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Cu</text>
<path d="M 125 140 L 125 78 L 310 78 L 485 78 L 485 140" fill="none" stroke="#1A1A1A" stroke-width="2"/>
<circle cx="310" cy="78" r="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
<text x="310" y="83" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">V</text>
<defs><marker id="earr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><polygon points="0 0, 7 3, 0 6" fill="#2B5FD9"/></marker></defs>
<line x1="160" y1="98" x2="260" y2="98" stroke="#2B5FD9" stroke-width="2" marker-end="url(#earr)"/>
<text x="205" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#2B5FD9">e⁻</text>
<path d="M 220 210 C 255 210, 255 145, 310 145 C 365 145, 365 210, 400 210" fill="none" stroke="#8D6E63" stroke-width="14" stroke-linecap="round"/>
<path d="M 220 210 C 255 210, 255 145, 310 145 C 365 145, 365 210, 400 210" fill="none" stroke="#D7CCC8" stroke-width="8" stroke-linecap="round"/>
<text x="310" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5F6B7A">salt bridge</text>
<text x="135" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#E53935">ANODE (−)</text>
<text x="135" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1A1A1A">Zn → Zn²⁺ + 2 e⁻</text>
<text x="135" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">oxidation</text>
<text x="485" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17754A">CATHODE (+)</text>
<text x="485" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1A1A1A">Cu²⁺ + 2 e⁻ → Cu</text>
<text x="485" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5F6B7A">reduction</text>
<text x="310" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">E° = E°(Cu²⁺/Cu) − E°(Zn²⁺/Zn) = 0.34 − (−0.76) = +1.10 V</text>
</svg>
